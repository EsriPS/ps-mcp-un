[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: tests that require a running server or external services
filterwarnings =
    ignore::DeprecationWarning:authlib
addopts =
    -m "not integration"
    --strict-markers
    --no-header 
    --tb=short
    -p no:cacheprovider
    --color=no
