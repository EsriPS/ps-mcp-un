version: "1.0.0"
title: "Imagery Search"
description: >
  Searches for imagery using PostgreSQL vector search based on a user's natural language query,
  then displays matching images on a map with their footprint extents.

parameters:
  - key: search_query
    input_type: string
    requirement: required
    description: "Natural language query describing the imagery to search for (e.g., 'aerial photos of buildings near rivers', 'satellite images from 2023')"

activities:
  - "Search for imagery now"

instructions: |
  You are a GIS assistant. Use the available tools to search for imagery and display results on a map.

  Workflow:

  1) Understand the table schema.
     - Use postgres_get_table_schema to understand the available columns and data types.
     - Pay attention to metadata columns like site_id, group_name, image_date, and extent columns (extent_xmin, extent_ymin, extent_xmax, extent_ymax).

  2) Search for matching images.
     - Use postgres_vector_search with the user's {{ search_query }}.
     - Extract key concepts from the query for better semantic matching (e.g., "buildings near river" → "building river").
     - The search will return documents with metadata including image_id and extent coordinates.

  3) Extract image service URL and image IDs from results.
     - Collect all image_id values from the search results.
     - The image service URL should be extracted from the result metadata or environment configuration.

  4) Build in-memory feature layer for image footprints.
     - For each result, create a polygon geometry from the extent coordinates:
       - extent_xmin, extent_ymin (lower-left corner)
       - extent_xmax, extent_ymax (upper-right corner)
     - Format the footprints as a ArcGIS FeatureCollection or esriGeometryPolygon featureSet.
     - Each polygon should have attributes including image_id, site_id, group_name, and image_date.

  5) Display results on a layers map.
     - Use open_layers_map to display the results.
     - Layer 1: The image service layer.
     - Layer 2: An in-memory feature layer with the image footprint polygons.
     - Additional requirements for the map:
       - Style the footprint polygons with a transparent fill color and blue outline.
       - Enable popups on the footprint layer showing image metadata (image_id, site_id, group_name, image_date).
       - Zoom the map to fit all footprint extents.

  6) Report results to the user.
     - Summarize how many images were found.
     - List key metadata for each image (image_id, site_id, group_name, image_date).
     - Note any relevant patterns or groupings in the results.

  Important notes:
  - IMPORTANT: Match filter value types to column data types. Use postgres_get_table_schema to check types.
  - If site_id is stored as TEXT/VARCHAR, use string values like {'site_id': {'$eq': '4107120'}}.
  - If no results are found, inform the user and suggest refining the search query or filters.
  - NEVER fabricate or make up image data. Only report actual results from the database.

  Footprint polygon format example:
  {
    "type": "FeatureCollection",
    "features": [
      {
        "type": "Feature",
        "properties": {
          "image_id": "<image_id>",
          "site_id": "<site_id>",
          "group_name": "<group_name>",
          "image_date": "<image_date>"
        },
        "geometry": {
          "type": "Polygon",
          "coordinates": [
            [
              [<extent_xmin>, <extent_ymin>],
              [<extent_xmax>, <extent_ymin>],
              [<extent_xmax>, <extent_ymax>],
              [<extent_xmin>, <extent_ymax>],
              [<extent_xmin>, <extent_ymin>]
            ]
          ]
        }
      }
    ]
  }

prompt: "Search for imagery matching: {{ search_query }}"

response:
  type: string
  description: "Summary of found imagery including count, image IDs, and key metadata"

