[project]
name = "ps-mcp"
description = "PS-MCP — Pluggable FastMCP server for ArcGIS-first workflows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
license = { text = "Apache-2.0" }
authors = [{ name = "Esri Professional Services" }]
keywords = ["mcp", "fastmcp", "arcgis", "esri", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=3.2.4,<4",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "starlette>=0.40,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff==0.15.12",
    "pre-commit>=3.5",
]
# Convenience: install all official routers at once.
all = [
    "psmcp-router-arcgis",
    "psmcp-router-feature-service",
    "psmcp-router-geoprocessing",
    "psmcp-router-location-services",
    "psmcp-router-mongo",
    "psmcp-router-postgres",
    "psmcp-router-utilitynetwork",
]

[project.scripts]
psmcp = "psmcp.cli:main"

# ---------------------------------------------------------------------------
# Build backend — hatchling + hatch-vcs for tag-driven versioning.
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
# Generates src/psmcp/_version.py at build/install time. Gitignored.
version-file = "src/psmcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psmcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/psmcp",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# ---------------------------------------------------------------------------
# uv workspace — single lockfile across the monorepo.
# ---------------------------------------------------------------------------

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
# `ps-mcp` itself must be listed because routers depend on it; uv needs the
# explicit workspace mapping to resolve those deps editably.
ps-mcp = { workspace = true }
psmcp-auth-oauth = { workspace = true }
psmcp-router-arcgis = { workspace = true }
psmcp-router-developer-tools = { workspace = true }
psmcp-router-feature-service = { workspace = true }
psmcp-router-geoprocessing = { workspace = true }
psmcp-router-location-services = { workspace = true }
psmcp-router-mongo = { workspace = true }
psmcp-router-postgres = { workspace = true }
psmcp-router-utilitynetwork = { workspace = true }

# ---------------------------------------------------------------------------
# Ruff — lint + format. See https://docs.astral.sh/ruff/.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/_version.py", "**/__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line-length handled by formatter
    "B008",  # do not perform function calls in argument defaults (fine for FastMCP)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
]

