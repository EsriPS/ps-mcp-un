[project]
name = "psmcp-router-arcgis"
description = "PS-MCP router plugin: arcgis (portal search, item info, map rendering)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "ps-mcp>=0.1.0,<1.0",
    "requests>=2.31,<3",
]

[project.entry-points."psmcp.routers"]
arcgis = "psmcp_router_arcgis:arcgis_router"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Use the monorepo root's git history so all packages share one version.
raw-options = { root = "../.." }
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/psmcp_router_arcgis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psmcp_router_arcgis"]
