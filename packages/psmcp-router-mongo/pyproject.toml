[project]
name = "psmcp-router-mongo"
description = "PS-MCP router plugin: mongo (MongoDB Atlas vector search)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "ps-mcp>=0.1.0,<1.0",
    "pymongo>=4.15.3,<5",
    "openai>=2.6.1,<3",
]

[project.entry-points."psmcp.routers"]
mongo = "psmcp_router_mongo:mongo_router"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/psmcp_router_mongo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psmcp_router_mongo"]
