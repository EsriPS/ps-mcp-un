[project]
name = "psmcp-router-utilitynetwork"
description = "PS-MCP router plugin: ArcGIS Utility Network trace tools."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "ps-mcp>=0.1.0,<1.0",
    "arcgis>=2.4,<3",
]

[project.entry-points."psmcp.routers"]
utilitynetwork = "psmcp_router_utilitynetwork:utilitynetwork_router"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../.." }

[tool.hatch.build.hooks.vcs]
version-file = "src/psmcp_router_utilitynetwork/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psmcp_router_utilitynetwork"]
